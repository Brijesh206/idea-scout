name: Idea Discovery

# Workflow A (docs/01-architecture.md): HN + Reddit + Product Hunt -> scoring
# -> Google Sheet -> Telegram digest. Runs on GitHub's free scheduled-cron tier
# (docs/08-deployment-github-actions.md).
#
# DEVIATION FROM doc 08 (flagged, decided 2026-07-12): doc 08 specifies a
# twice-daily schedule, sized for continuously triaging a growing backlog. The
# user's actual workflow is serial, not continuous — pick one idea, spend up
# to ~15 days evaluating/building/marketing/launching it, then look for the
# next. Running 2x/day the whole time produces ~28 paid Haiku digests nobody
# reads per cycle. Schedule below runs on the 1st and 15th of each month
# instead — plain cron has no native "every 15 days", so this is the standard
# way to approximate it (gaps land ~14-17 days apart) without extra tooling.
# workflow_dispatch stays available to trigger a run early if a cycle ends
# ahead of schedule.
#
# Time is a first guess, timed to land shortly before a dev window opens
# (IST = UTC+5:30, per doc 08): ~19:30 IST (14:00 UTC) -> before the ~8:30/9 PM
# weeknight start. Doc 08 explicitly warns not to trust a guessed time —
# verify against real run timestamps in the Actions log and adjust if it's
# landing at the wrong local time (GitHub Actions cron can also run several
# minutes late under load).

on:
  schedule:
    - cron: "0 14 1,15 * *"  # ~19:30 IST, the 1st and 15th of each month
  workflow_dispatch: {}       # manual trigger — use this if a cycle ends early

jobs:
  discover:
    runs-on: ubuntu-latest
    # Reddit's anonymous RSS rate limit is ~1 request/60s per IP (confirmed
    # empirically, see config.py REDDIT_REQUEST_DELAY_SECONDS) — with the
    # 7-subreddit default list, Reddit ingestion alone takes ~7 minutes.
    # Generous headroom on top for HN/PH + LLM scoring batches (free-tier
    # retries can add real latency).
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run discovery pipeline
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODUCTHUNT_API_TOKEN: ${{ secrets.PRODUCTHUNT_API_TOKEN }}
        run: python main_discovery.py
